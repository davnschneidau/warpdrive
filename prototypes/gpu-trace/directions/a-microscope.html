<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Direction A · Microscope</title>
<style>
body{margin:0;font:14px/1.4 "IBM Plex Sans",sans-serif;background:#f3f1ec;color:#141414;padding:24px}

<p>Direction A — Execution microscope (structural sketch)</p>
<h1>Lens on SM 0 × SM 3 only</h1>
<p>Other SMs collapse to a silhouette. Time window defaults to the wait. Dependency still needs an explicit beam (supplied in the synthesis).</p>
<div class="lens">
  <div class="sm"><div class="label">SM 0 · roles</div><div class="track"><div class="bar" style="left:10%;width:40%"></div><div class="bar" style="left:35%;width:45%"></div></div></div>
  <div class="sm"><div class="label">SM 3 · wait</div><div class="track"><div class="bar wait" style="left:20%;width:55%"></div></div></div>

</div>
