<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Direction C · Source workbench</title>
<style>
body{margin:0;font:14px/1.4 "IBM Plex Sans",sans-serif;background:#f3f1ec;color:#141414}
.grid{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.pane{padding:24px;border-right:1px solid rgba(0,0,0,.12)}
h1{font:600 26px/1.1 Newsreader,serif;max-width:18ch}
pre{background:#faf9f6;border:1px solid rgba(0,0,0,.12);padding:12px;font:12px ui-monospace}
.track{height:22px;background:#ddd9d1;position:relative;margin:8px 0}
.bar{position:absolute;top:2px;bottom:2px;background:#2a2a2a}
.wait{background:#b42318}
.hl{outline:2px solid #0f6b5c}
p{color:#3a3a3a}
</style></head><body>
<div class="grid">
  <div class="pane">
    <p>Direction C — Source ↔ execution</p>
    <h1>Code owns half the frame</h1>
    <pre class="hl">kernels/vrx/controller.cuh:142
vm_wait(… counter …)</pre>
    <pre>kernels/vrx/roles.cuh:88
// MMA instance 1 (producer)</pre>
  </div>
  <div class="pane">
    <p>Linked execution</p>
    <div class="track"><div class="bar hl" style="left:40%;width:35%"></div></div>
    <div class="track"><div class="bar wait" style="left:20%;width:45%"></div></div>
    <p>Absorbed as the evidence/source drawer in the synthesis — not a permanent 50/50 split.</p>
  </div>
</div>
</body></html>
