<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memory investigation preview (dock body fixture)</title>
  <style>
    :root {
      --bg: #f7f8fa; --panel: #fff; --text: #121316; --muted: #6b6e76;
      --border: rgba(0,0,0,.1); --brand: #4176e6; --cache: #eef2f8;
      --font: "IBM Plex Sans", "Segoe UI", sans-serif; --mono: ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); }
    .note { padding: 10px 16px; background: #fff8e6; border-bottom: 1px solid var(--border); font-size: 12px; color: #6a5500; }
    iframe, .frame { border: 0; width: 100%; height: calc(100vh - 42px); }
  </style>
</head>
<body>
  <div class="note">
    Visual preview of the dock investigation body using the same baseline fixture as
    <code>@deepseek-ai/dsh-gpu-evidence</code>. Product mount: enable
    <code>gpu-investigation-bundle</code> and open the <strong>GPU memory</strong> sidebar tab.
  </div>
  <div id="app" class="frame"></div>
  <script type="module">
    // Lightweight standalone mirror for craft review when Web app is not running.
    // Keep semantics aligned with MemoryInvestigationView + fixtures.
    const baseline = await import('../../packages/experimental/gpu-evidence/src/fixtures/memory-baseline.ts').then(m => m.default).catch(() => null)
    // Fallback: fetch is unavailable for .ts in static server; embed via dynamic JSON path not shipped —
    // serve through a tiny inline copy of overview for screenshot paths.
    const app = document.getElementById('app')
    if (!baseline) {
      app.innerHTML = `<pre style="padding:16px;font:12px var(--mono)">Open this preview via Vitest/Story path, or run the Web app with the GPU investigation bundle enabled.\n\nPrimary surface: packages/experimental/client-ui-gpu-investigation\nFixture: packages/experimental/gpu-evidence/src/fixtures/memory-baseline.ts</pre>`
    }
  </script>
</body>
</html>
