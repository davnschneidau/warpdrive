<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Direction C · Cutaway CTA</title>
  <link rel="stylesheet" href="./tokens.css" />
  <style>
    body { height: 100vh; min-width: 1280px; display: grid; grid-template-rows: 48px 1fr; }
    .top {
      display: flex; align-items: center; gap: 12px; padding: 0 16px;
      border-bottom: 0.5px solid var(--border); background: var(--bg-1);
    }
    .brand { font-weight: 600; }
    .brand span { color: var(--text-3); font-weight: 500; margin-left: 8px; }
    .grow { flex: 1; }
    .shell {
      display: grid; grid-template-columns: 1.35fr 0.9fr; min-height: 0;
    }
    .cutaway {
      min-height: 0; display: flex; flex-direction: column;
      background: radial-gradient(1200px 600px at 30% 20%, #f8fafc, #eef1f5);
      border-right: 0.5px solid var(--border);
    }
    .tools {
      display: flex; gap: 8px; align-items: center; padding: 10px 16px;
      background: var(--bg-1); border-bottom: 0.5px solid var(--border-2);
    }
    .viz { flex: 1; min-height: 0; padding: 12px 16px; overflow: auto; }
    svg.cut { width: 100%; height: auto; max-width: 920px; display: block; margin: 0 auto; }
    .side {
      min-height: 0; display: grid; grid-template-rows: 1fr 1fr; background: var(--bg-1);
    }
    .panel { min-height: 0; display: flex; flex-direction: column; border-bottom: 0.5px solid var(--border-2); }
    .panel-h {
      padding: 10px 14px; font-weight: 600; border-bottom: 0.5px solid var(--border-2);
      display: flex; gap: 8px; align-items: center;
    }
    .body { flex: 1; overflow: auto; padding: 12px 14px; }
    .code { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; color: var(--text-2); line-height: 1.55; margin: 0; }
    .code .hl { background: rgba(65,118,230,0.14); }
    .msg { margin-bottom: 10px; }
    .msg .b { padding: 9px 11px; border-radius: 12px; background: var(--bg-2); color: var(--text-2); }
    .msg.user .b { background: rgb(237,243,254); color: var(--brand-ink); }
    .scrub {
      display: flex; align-items: center; gap: 10px; padding: 8px 16px 14px;
    }
    input[type=range] { flex: 1; }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">DeepSeek Harness <span>Direction C · Cutaway CTA</span></div>
    <button data-act="explain" class="primary">Explain GEMM</button>
    <button data-act="prev">◀</button>
    <button data-act="next">Step ▶</button>
    <button data-act="change">Apply STAGES=5</button>
    <div class="grow"></div>
    <a href="./index.html" style="color:var(--brand);text-decoration:none;font-weight:500">All directions</a>
  </header>
  <div class="shell">
    <section class="cutaway">
      <div class="tools">
        <span class="pill annotated">warp roles annotated</span>
        <span class="pill modeled">time scrub modeled</span>
        <span class="pill compiled" id="res">168 regs · 243 KB</span>
        <span class="grow"></span>
        <span class="muted" id="phase-label">t = 0 · idle</span>
      </div>
      <div class="viz" id="viz"></div>
      <div class="scrub">
        <span class="muted">Pipeline time</span>
        <input type="range" id="scrub" min="0" max="5" step="1" value="0" />
      </div>
    </section>
    <aside class="side">
      <div class="panel">
        <div class="panel-h">Linked source <span class="pill" id="loc-pill">—</span></div>
        <div class="body"><pre class="code" id="code"></pre></div>
      </div>
      <div class="panel">
        <div class="panel-h">AI collaborator</div>
        <div class="body" id="chat"></div>
      </div>
    </aside>
  </div>
  <script>
const state = { t: 0, selected: 'cta', conflict: false };

function render() {
  const t = state.t;
  const conflict = state.conflict;
  const stages = conflict ? 5 : 4;
  const filled = Math.min(stages, t);
  const barrierOpen = t >= 2;
  const mmaOn = t >= 3;
  const epiOn = t >= 4;

  const stageW = 70;
  let stageBand = '';
  for (let i = 0; i < stages; i++) {
    const x = 180 + i * (stageW + 10);
    const live = i < filled;
    stageBand += `
      <g class="hit" data-id="stage${i}" style="cursor:pointer">
        <rect x="${x}" y="248" width="${stageW}" height="110" rx="8"
          fill="${live ? 'rgba(65,118,230,0.2)' : 'rgba(255,255,255,0.55)'}"
          stroke="${state.selected==='stage'+i ? '#416ee6' : 'rgba(0,0,0,0.1)'}" stroke-width="${state.selected==='stage'+i?2:1}"/>
        <text x="${x + 10}" y="268" font-size="11" fill="#848587">s${i}</text>
        ${live ? tileMini(x + 8, 278, stageW - 16, 64) : `<text x="${x+18}" y="320" font-size="11" fill="#c0c0c0">∅</text>`}
      </g>`;
  }

  const svg = `
  <svg class="cut" viewBox="0 0 780 620" xmlns="http://www.w3.org/2000/svg">
    <rect x="40" y="40" width="700" height="540" rx="22" fill="rgba(255,255,255,0.72)" stroke="rgba(0,0,0,0.08)"/>
    <text x="64" y="72" font-size="16" font-weight="600">One CTA cutaway</text>
    <text x="64" y="92" font-size="12" fill="#848587">Vertical specialization · shared memory is the mid-band · time scrubs left→right through stages</text>

    <!-- Producer -->
    <g class="hit" data-id="producer" style="cursor:pointer">
      <rect x="64" y="120" width="652" height="86" rx="14"
        fill="${t <= 2 ? 'rgba(65,118,230,0.12)' : 'rgba(65,118,230,0.04)'}"
        stroke="${state.selected==='producer'?'#416ee6':'rgba(65,118,230,0.25)'}" stroke-width="${state.selected==='producer'?2:1}"/>
      <text x="84" y="148" font-size="13" font-weight="600" fill="#416ee6">Producer warp</text>
      <text x="84" y="168" font-size="11" fill="#848587">Issues TMA into ring · waits on empty[stage]</text>
      ${laneStrip(84, 180, 32, '#416ee6', t <= 2)}
      ${t >= 1 && t < 3 ? `<text x="520" y="148" font-size="12" fill="#416ee6" font-weight="600">writing stage ${Math.max(0, filled - 1)}</text>` : ''}
    </g>

    <!-- arrows into smem -->
    <path d="M120 206 L120 248" stroke="#416ee6" stroke-width="2" marker-end="url(#a)" opacity="${t >= 1 ? 1 : 0.2}"/>

    <!-- SMEM mid-band -->
    <rect x="64" y="230" width="652" height="150" rx="14" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.3)"/>
    <text x="84" y="254" font-size="13" font-weight="600" fill="#b45309">Shared memory</text>
    ${stageBand}
    ${conflict ? `<text x="84" y="370" font-size="12" fill="#dc2626" font-weight="600">STAGES=5 exceeds documented 256 KB window</text>` : `<text x="84" y="370" font-size="11" fill="#848587">Tile cells are schematic 128B atoms — layout annotated, residency modeled per beat</text>`}

    <!-- Barrier between smem and mma -->
    <g class="hit" data-id="barrier" style="cursor:pointer">
      <rect x="300" y="390" width="200" height="36" rx="8"
        fill="${barrierOpen ? 'rgba(34,197,94,0.15)' : 'rgba(245,158,11,0.15)'}"
        stroke="${barrierOpen ? '#22c55e' : '#f59e0b'}"/>
      <text x="320" y="412" font-size="12" font-weight="600">${barrierOpen ? '▼ full[] open' : '■ full[] closed'}</text>
    </g>

    <!-- MMA -->
    <g class="hit" data-id="mma" style="cursor:pointer">
      <rect x="64" y="440" width="320" height="100" rx="14"
        fill="${mmaOn ? 'rgba(124,58,237,0.12)' : 'rgba(124,58,237,0.04)'}"
        stroke="${state.selected==='mma'?'#7c3aed':'rgba(124,58,237,0.25)'}" stroke-width="${state.selected==='mma'?2:1}"/>
      <text x="84" y="468" font-size="13" font-weight="600" fill="#7c3aed">MMA issuer warp</text>
      <text x="84" y="488" font-size="11" fill="#848587">${mmaOn ? 'elect lane issuing UMMA into acc' : 'waiting on barrier'}</text>
      ${laneStrip(84, 500, 32, '#7c3aed', mmaOn)}
    </g>

    <!-- Epilogue -->
    <g class="hit" data-id="epilogue" style="cursor:pointer">
      <rect x="400" y="440" width="316" height="100" rx="14"
        fill="${epiOn ? 'rgba(14,165,160,0.12)' : 'rgba(14,165,160,0.04)'}"
        stroke="${state.selected==='epilogue'?'#0ea5a0':'rgba(14,165,160,0.25)'}" stroke-width="${state.selected==='epilogue'?2:1}"/>
      <text x="420" y="468" font-size="13" font-weight="600" fill="#0ea5a0">Epilogue warpgroups</text>
      <text x="420" y="488" font-size="11" fill="#848587">${epiOn ? 'draining acc0 while MMA may fill acc1' : 'idle until accumulator ready'}</text>
      ${laneStrip(420, 500, 64, '#0ea5a0', epiOn)}
    </g>

    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#416ee6"/>
      </marker>
    </defs>
  </svg>`;

  document.getElementById('viz').innerHTML = svg;
  document.querySelectorAll('.hit').forEach(g => {
    g.addEventListener('click', () => {
      state.selected = g.getAttribute('data-id');
      syncCode();
      push('user', `Select ${state.selected}`);
      push('ai', tip(state.selected));
      render();
    });
  });

  const labels = ['idle', 'loader fills s0', 'barrier opens', 'MMA consumes', 'epilogue drains', 'STAGES=5 conflict'];
  document.getElementById('phase-label').textContent = `t = ${t} · ${labels[t] || ''}`;
  document.getElementById('res').textContent = conflict ? 'SMEM window conflict' : '168 regs · 243 KB';
  document.getElementById('res').className = 'pill ' + (conflict ? 'modeled' : 'compiled');
  document.getElementById('scrub').value = String(t);
  syncCode();
}

function tileMini(x, y, w, h) {
  let s = '';
  const cols = 6, rows = 5;
  const cw = w / cols, rh = h / rows;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    s += `<rect x="${x + c * cw}" y="${y + r * rh}" width="${cw - 0.8}" height="${rh - 0.8}" fill="rgba(65,118,230,${0.35 + ((r + c) % 3) * 0.15})"/>`;
  }
  return s;
}

function laneStrip(x, y, n, color, on) {
  let s = '';
  for (let i = 0; i < n; i++) {
    s += `<circle cx="${x + (i % 16) * 7}" cy="${y + Math.floor(i / 16) * 7}" r="2.1" fill="${color}" opacity="${on ? 1 : 0.22}"/>`;
  }
  return s;
}

function syncCode() {
  const map = {
    producer: ['producer()', `case 1: <span class="hl">producer(s, tmA, tmB, ...)</span>;`],
    mma: ['mma_issuer()', `case 2: <span class="hl">mma_issuer(s, tmem, ...)</span>;`],
    epilogue: ['epilogue()', `default: <span class="hl">epilogue(s, tmem, ...)</span>;`],
    barrier: ['mbarrier', `ptx::mbar_wait(&s.full[stage], phase);`],
    stage0: ['a[0]/b[0]', `// SMEM stage 0 holds annotated A/B tile`],
  };
  const key = state.selected?.startsWith('stage') ? 'stage0' : state.selected;
  const hit = map[key] || ['cta', 'switch (warp) { ... }'];
  document.getElementById('loc-pill').textContent = hit[0];
  document.getElementById('code').innerHTML = `// linked by Investigation Focus\n${hit[1]}\n\n// grounding\n// roles: annotated intent\n// residency beats: modeled\n// resources: compiled fixture`;
}

function tip(id) {
  if (id?.startsWith('stage')) return 'This stage column is a real ring slot. Cells sketch swizzle atoms; fill state follows the scrubbed beat.';
  return ({
    producer: 'Top band = producer. Click synced the source highlight to producer().',
    mma: 'MMA band waits on the barrier chip above, then consumes a stage.',
    epilogue: 'Epilogue sits beside MMA to show overlap in the same CTA cutaway.',
    barrier: 'Barrier is a condition connecting producer completion to MMA entry — modeled open/closed.',
  })[id] || 'Cutaway selection updated.';
}

const chat = document.getElementById('chat');
function push(who, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.innerHTML = `<div class="b">${text}</div>`;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
  const a = b.getAttribute('data-act');
  if (a === 'explain') {
    state.t = 0; state.conflict = false;
    push('user', 'Show how warps cooperate inside this CTA.');
    push('ai', 'Cutaway view: producer on top, SMEM mid-band, MMA and epilogue below. Scrub time to watch stages fill and the barrier open.');
  } else if (a === 'next') {
    state.t = Math.min(state.conflict ? 5 : 4, state.t + 1);
    if (state.t === 2) push('ai', 'Barrier opens — MMA was waiting on full[].');
    if (state.t === 3) push('ai', 'MMA lanes ignite; stage tiles feed Tensor Cores.');
  } else if (a === 'prev') {
    state.t = Math.max(0, state.t - 1);
  } else if (a === 'change') {
    state.conflict = true; state.t = 5;
    push('user', 'Change the kernel to five pipeline stages.');
    push('ai', 'Cutaway grows a fifth stage column, then marks the compiled window conflict. Source link still tracks the ring.');
  }
  render();
}));

document.getElementById('scrub').addEventListener('input', e => {
  state.t = +e.target.value;
  if (state.t < 5) state.conflict = false;
  render();
});

push('ai', 'Direction C: engineering cutaway of one CTA. Time scrub is the primary control; chat and code stay linked.');
render();
  </script>
</body>
</html>
